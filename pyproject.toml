[project]
name = "zetelton-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vzn.d3v", email = "emiliendaix@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "ollama>=0.6.2",
    "openai>=3.14.1",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
]

[project.scripts]
zetelton = "agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff.lint]
ignore=["N999"]
